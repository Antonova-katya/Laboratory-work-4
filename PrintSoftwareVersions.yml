name: Print Software Versions

on:
  push:
    branches:
      - laboratory-work-4
  workflow_dispatch:

jobs:
  data-processing-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Python version
        run: python3 --version
      - name: Print pip version
        run: pip3 --version
      - name: Print OpenCV version
        run: |
          pip3 install --quiet opencv-python-headless
          python3 -c "import cv2; print('OpenCV', cv2.__version__)"
      - name: Print Node.js version
        run: node --version

  dbms-versions:
    needs: data-processing-versions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Print PostgreSQL version
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "SELECT version();"
